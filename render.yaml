services:
  - type: web
    name: windscope-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: DECISION_CUTOFF_HOUR
        value: "9"
      - key: DECISION_CUTOFF_MINUTE
        value: "50"
      - key: DECISION_CUTOFF_TIMEZONE
        value: Europe/London
